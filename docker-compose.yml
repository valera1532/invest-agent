services:
  postgres:
    image: postgres:16
    container_name: invest-agent-postgres
    environment:
      POSTGRES_DB: invest_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - invest-agent-postgres-data:/var/lib/postgresql/data

volumes:
  invest-agent-postgres-data:
